{% extends "auth_base.html" %}
{% block title %}登录 - DataPaper{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="container auth-layout auth-layout-compact">
        <div class="auth-intro">
            <span class="section-kicker">WELCOME BACK</span>
            <h1>继续追踪你的研究方向</h1>
            <p>登录后查看按研究领域匹配的数据论文，并随时更新你的兴趣档案。</p>
        </div>
        <div class="auth-card">
            <h2>登录</h2>
            {% include "_flash_messages.html" %}
            <form method="post" class="auth-form">
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input id="email" name="email" type="email" maxlength="255" value="{{ request.form.get('email', '') }}" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input id="password" name="password" type="password" required autocomplete="current-password">
                </div>
                <button class="button button-primary auth-submit" type="submit">登录</button>
            </form>
            <p class="auth-switch">还没有账户？<a href="{{ url_for('register') }}">免费注册</a></p>
        </div>
    </div>
</section>
{% endblock %}
